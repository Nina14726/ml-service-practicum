global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ml-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:8000

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets:
          - rabbitmq:15692

  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family:
        - queue_coarse_metrics
        - queue_consumer_count
    static_configs:
      - targets:
          - rabbitmq:15692

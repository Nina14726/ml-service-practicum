name: tests

on:
  push:
    branches:
      - task-7-testing
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+pysqlite:///./test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r app/requirements.txt
      - name: Run tests
        working-directory: app
        run: pytest
